  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink:       #E4007B;
    --pink-soft:  rgba(228, 0, 123, 0.18);
    --pink-deep:  #b30061;
    --ink:        #ffffff;

    --ink-soft:   #aaaaaa;
    --paper:      #0f0f0f;
    --paper-2:    #1a1a1a;
    --border:     rgba(255,255,255,0.22);
  }

  html, body {
    height: 100%;
    background: #0f0f0f;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  /* Full-page scratch card texture — fixed, 70% opacity */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('/Scratcher_background.png') center/cover no-repeat;
    opacity: 0.7;
    pointer-events: none;
    z-index: -1;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: stretch;
    min-height: 100dvh;
    font-family: 'Inter', system-ui, sans-serif;
  }

  #root {
    width: 100%;
    max-width: 430px;
    background: transparent;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  button { border: none; cursor: pointer; background: none; font-family: 'Inter', sans-serif; }
  button:active { opacity: 0.8; transform: scale(0.97); }
  input { font-family: 'Inter', sans-serif; }

  /* Screen slide transitions */
  .screen-slide-in  { animation: slideIn  0.28s cubic-bezier(0.22,1,0.36,1) forwards; }
  .screen-slide-out { animation: slideOut 0.28s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes slideIn  { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes slideOut { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  /* Art container — clean, photo-ready */
  .art-hatch {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  /* Gold scratched-leaf overlay for Reveal tiles */
  .gold-leaf {
    position: absolute;
    inset: -12%;
    pointer-events: none;
    z-index: 3;
    background:
      linear-gradient(112deg,
        transparent 0%, transparent 36%,
        rgba(201,160,78,0.80) 40%, rgba(248,227,163,0.92) 48%,
        rgba(138,107,42,0.80) 54%, transparent 60%, transparent 100%);
    mix-blend-mode: screen;
    filter: blur(0.3px);
  }
  .gold-leaf::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(72deg,
        transparent 60%, rgba(248,227,163,0.65) 68%,
        rgba(201,160,78,0.50) 74%, transparent 82%);
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 2px; }

  /* Artwork image ready — fills the container, no flicker */
  .art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Shimmer pulse for photo placeholder areas */
  @keyframes shimmer {
    0%   { opacity: 0.55; }
    50%  { opacity: 0.85; }
    100% { opacity: 0.55; }
  }
  .art-shimmer { animation: shimmer 2.4s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>

// ─── TRACKING ──────────────────────────────────────────────────────────────

const SESSION_ID = crypto.randomUUID();
const SESSION_START = Date.now();

const trackEvent = (eventType, screenName, metadata = {}) => {
  const sb = window.__moco_sb;
  if (!sb) return;
  sb.from('events').insert({
    session_id: SESSION_ID,
    event_type: eventType,
    screen_name: screenName,
    metadata,
  }).then(() => {});
};

const startSession = () => {
  const sb = window.__moco_sb;
  if (!sb) return;
  sb.from('sessions').insert({
    id: SESSION_ID,
    started_at: new Date().toISOString(),
    language: navigator.language,
    user_agent: navigator.userAgent,
  }).then(() => {});
};

const completeSession = () => {
  const sb = window.__moco_sb;
  if (!sb) return;
  sb.from('sessions').update({
    completed_at: new Date().toISOString(),
    duration_seconds: Math.round((Date.now() - SESSION_START) / 1000),
  }).eq('id', SESSION_ID).then(() => {});
};

const PickerScreen = ({ artworks, onContinue, onBack }) => {
  const [selected, setSelected] = useState(new Set());
  const count = selected.size;

  const toggle = (i) => {
    const aw = tileArtwork(artworks, i);
    if (selected.has(i)) {
      trackEvent('artwork_deselected', 'picker', { artwork_id: aw.id ?? null, title: aw.title });
    } else if (selected.size < 5) {
      trackEvent('artwork_selected', 'picker', { artwork_id: aw.id ?? null, title: aw.title });
    }
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(i)) { next.delete(i); }
      else if (next.size < 5) { next.add(i); }
      return next;
    });
  };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden',
      background: 'linear-gradient(rgba(15,15,15,0.55), rgba(15,15,15,0.55)), url("/Scratcher_background.png") center/cover fixed #0f0f0f',
    }}>
      {/* Top nav */}
      <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px 12px', borderBottom: '1px solid rgba(255,255,255,0.15)' }}>
        <img src="/logo-moco-white.png" alt="Moco" style={{ height: 26, display: 'block' }} />
        <Counter>{count} / 5</Counter>
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '12px 16px 0', overflow: 'hidden' }}>

        {/* Header */}
        <div style={{ marginBottom: 10, flexShrink: 0 }}>
          <div style={{ fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 22, lineHeight: 1, color: 'var(--ink)' }}>Pick your favourite</div>
          <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 400, fontSize: 10, color: 'var(--ink-soft)', letterSpacing: '0.06em', marginTop: 4, textTransform: 'uppercase' }}>
            Choose 3 – 5 artworks
          </div>
        </div>

        {/* 3×5 Grid — scrollable, same pattern as InsightGridScreen */}
        <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 'calc(120px + env(safe-area-inset-bottom, 16px))' }}>
          <div style={{
            display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6,
            margin: '0 -2px', padding: '2px',
          }}>
            {Array.from({ length: 15 }).map((_, i) => {
              const on  = selected.has(i);
              const aw  = tileArtwork(artworks, i);
              return (
                <button
                  key={i}
                  onClick={() => toggle(i)}
                  style={{
                    aspectRatio: '7/6', padding: 0,
                    border: on ? '2px solid var(--pink)' : '3px solid rgba(255,255,255,0.82)',
                    borderRadius: 3, overflow: 'hidden',
                    position: 'relative', cursor: 'pointer',
                    background: aw.bg,
                    transition: 'border-color 0.12s, box-shadow 0.12s',
                    boxShadow: on ? '0 0 0 1px var(--pink)' : 'none',
                  }}
                >
                  {/* Real photo */}
                  {aw.img && <img className="art-img" src={aw.img} alt={aw.title} />}

                  {/* Selected: pink tint overlay */}
                  {on && (
                    <div style={{
                      position: 'absolute', inset: 0, pointerEvents: 'none',
                      background: 'rgba(228,0,123,0.22)',
                    }} />
                  )}

                  {/* Checkmark (selected) */}
                  {on && (
                    <div style={{
                      position: 'absolute', top: 3, right: 3,
                      width: 15, height: 15, background: 'var(--pink)',
                      borderRadius: 2,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 9, color: 'white',
                    }}>✓</div>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {/* CTA — fixed at bottom, never moves */}
        <div style={{ flexShrink: 0, padding: '12px 0 0', paddingBottom: 'calc(18px + env(safe-area-inset-bottom, 0px))', display: 'flex', gap: 8 }}>

          }
        </div>
      </div>
    </div>
  );
};

const VisMapModule = ({ mapKey, xy, locationLabel }) => {
  const map = MAP_SVGS[mapKey] || MAP_SVGS.new_york;

  const px = xy[0], py = xy[1];
  return (
    <VisModule label="Where">
      <div style={{ position: 'relative', flex: 1, minHeight: 56, borderRadius: 6, overflow: 'hidden' }}>
        <svg viewBox="0 0 100 56" preserveAspectRatio="xMidYMid meet"
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>

              fill={layer.fill || 'none'}

          ))}
          {/* Pin shadow */}
          <ellipse cx={px + 1} cy={py + 10} rx="3" ry="1.5" fill="rgba(0,0,0,0.15)"/>

const VisWhenModule = ({ year, life }) => {
  const START = 1880, END = 2026;
  const pos = y => Math.max(0, Math.min(1, (y - START) / (END - START)));
  const t       = pos(year);
  // Active career: born+22 → died (or now)
  const activeStart = pos((life?.born ?? 1940) + 22);
  const activeEnd   = pos(life?.died ?? 2026);
  const nowT        = pos(2026);
  const ticks = [1920, 1960, 2000];
  return (
    <VisModule label="When">
      <div style={{ position: 'relative', height: 58, flex: 1 }}>
        {/* Active career band */}
        <div style={{
          position: 'absolute',
          left: `${activeStart * 100}%`,
          width: `${Math.max(0, activeEnd - activeStart) * 100}%`,
          top: 30, height: 8,
          background: 'var(--pink-soft)',
          border: '1px solid rgba(255,61,138,0.35)',
          borderRadius: 3,
        }}/>
        {/* Timeline line */}
        <div style={{ position: 'absolute', left: 0, right: 0, top: 34, height: 1.5, background: 'var(--ink)' }}/>
        {/* Tick marks */}
        {ticks.map(y => {
          const tt = pos(y);
          return (
            <React.Fragment key={y}>
              <div style={{ position: 'absolute', left: `${tt*100}%`, top: 31, width: 1.5, height: 7, background: 'var(--ink-soft)', transform: 'translateX(-50%)' }}/>
              <div style={{ position: 'absolute', left: `${tt*100}%`, top: 42, ...S.mono, fontSize: 6.5, color: 'var(--ink-soft)', transform: 'translateX(-50%)', lineHeight: 1 }}>{y}</div>
            </React.Fragment>
          );
        })}
        {/* "Now" tick */}
        <div style={{ position: 'absolute', left: `${nowT*100}%`, top: 29, width: 1.5, height: 9, background: 'var(--ink)', transform: 'translateX(-50%)' }}/>
        <div style={{ position: 'absolute', left: `${nowT*100}%`, top: 42, fontFamily: "'Inter', sans-serif", fontSize: 6.5, fontWeight: 700, color: 'var(--ink)', transform: 'translateX(-50%)', lineHeight: 1 }}>now</div>
        {/* Year label — ABOVE the star */}
        <div style={{
          position: 'absolute', left: `${t*100}%`, top: 0,
          transform: 'translateX(-50%)',
          fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 11, color: 'var(--pink)', lineHeight: 1,
        }}>{year}</div>
        {/* Star */}
        <div style={{
          position: 'absolute', left: `${t*100}%`, top: 12,
          transform: 'translateX(-50%)',
          fontSize: 16, color: 'var(--pink)', lineHeight: 1,
        }}>★</div>
      </div>
    </VisModule>
  );
};

            <div style={{ position: 'absolute', left: 0, right: 0, top: '50%', height: 1, background: 'var(--border)' }}/>
            <div style={{
              position: 'absolute', left: `${bornT * 100}%`,

const MaterialIcon = ({ name, size = 18 }) => {
  const n = name.toLowerCase();
  const s = { display: 'block' };
  if (n.includes('spray'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="5" y="7" width="7" height="9" rx="1.5" fill="var(--ink)"/>
      <rect x="9" y="3" width="2" height="5" rx="1" fill="var(--ink)"/>
      <circle cx="13" cy="3" r="1.5" fill="var(--ink)"/>
      <rect x="11" y="2.5" width="2" height="1" fill="var(--ink)"/>
    </svg>;
  if (n.includes('stencil'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="2" y="2" width="14" height="14" rx="1" fill="none" stroke="var(--ink)" strokeWidth="1.5"/>
      <rect x="5" y="5" width="8" height="8" rx="0.5" fill="var(--ink)" opacity="0.15"/>
      <path d="M7 9h4M9 7v4" stroke="var(--ink)" strokeWidth="1.5" strokeLinecap="round"/>
    </svg>;
  if (n.includes('wall') || n.includes('brick'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="2" y="3" width="14" height="3.5" rx="0.5" fill="var(--ink)"/>
      <rect x="2" y="7.5" width="6" height="3.5" rx="0.5" fill="var(--ink)"/>
      <rect x="9.5" y="7.5" width="6.5" height="3.5" rx="0.5" fill="var(--ink)"/>
      <rect x="2" y="12" width="9" height="3" rx="0.5" fill="var(--ink)"/>
      <rect x="12.5" y="12" width="3.5" height="3" rx="0.5" fill="var(--ink)"/>
    </svg>;
  if (n.includes('flower'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <circle cx="9" cy="9" r="2.5" fill="var(--pink)"/>
      {[0,60,120,180,240,300].map(a => <ellipse key={a} cx={9+4.5*Math.cos(a*Math.PI/180)} cy={9+4.5*Math.sin(a*Math.PI/180)} rx="2" ry="1.2" fill="var(--ink)" opacity="0.7" transform={`rotate(${a} ${9+4.5*Math.cos(a*Math.PI/180)} ${9+4.5*Math.sin(a*Math.PI/180)})`}/>)}
    </svg>;
  if (n.includes('steel') || n.includes('chrome') || n.includes('mirror') || n.includes('polish'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <circle cx="9" cy="9" r="6.5" fill="var(--ink)" opacity="0.12"/>
      <circle cx="9" cy="9" r="6.5" fill="none" stroke="var(--ink)" strokeWidth="1.2"/>
      <path d="M5 6.5 Q9 4 13 6.5" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" opacity="0.9"/>
    </svg>;
  if (n.includes('canvas') || n.includes('tarp'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="2" y="3" width="14" height="12" rx="1" fill="none" stroke="var(--ink)" strokeWidth="1.5"/>
      <line x1="2" y1="3" x2="16" y2="15" stroke="var(--ink)" strokeWidth="0.8" opacity="0.3"/>
      <line x1="16" y1="3" x2="2" y2="15" stroke="var(--ink)" strokeWidth="0.8" opacity="0.3"/>
    </svg>;
  if (n.includes('oilstick') || n.includes('oil stick') || n.includes('crayon'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="7" y="2" width="4" height="12" rx="1" fill="var(--ink)" transform="rotate(20 9 9)"/>
      <polygon points="9,15 7,12 11,12" fill="var(--pink)" transform="rotate(20 9 9)"/>
    </svg>;
  if (n.includes('acrylic') || n.includes('oil paint') || n.includes('paint'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="5" y="3" width="8" height="10" rx="1" fill="var(--ink)" opacity="0.8"/>
      <rect x="7" y="13" width="4" height="3" rx="0.5" fill="var(--ink)"/>
      <rect x="8" y="1" width="2" height="3" rx="0.5" fill="var(--ink)" opacity="0.5"/>
    </svg>;
  if (n.includes('screen') || n.includes('print') || n.includes('ink'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      {[3,7,11,15].map(x => [3,7,11,15].map(y => <circle key={`${x}${y}`} cx={x} cy={y} r="1" fill="var(--ink)" opacity="0.7"/>))}
    </svg>;
  if (n.includes('marker'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="7" y="2" width="4" height="12" rx="2" fill="var(--ink)"/>
      <rect x="7.5" y="14" width="3" height="2.5" rx="0.5" fill="var(--pink)"/>
    </svg>;
  if (n.includes('collage') || n.includes('mixed'))
    return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
      <rect x="2" y="2" width="8" height="7" rx="0.5" fill="var(--ink)" opacity="0.3"/>
      <rect x="8" y="9" width="8" height="7" rx="0.5" fill="var(--ink)" opacity="0.6"/>
      <rect x="5" y="6" width="7" height="6" rx="0.5" fill="var(--ink)" opacity="0.15" stroke="var(--ink)" strokeWidth="0.8"/>
    </svg>;
  // Default: dot
  return <svg width={size} height={size} viewBox="0 0 18 18" style={s}>
    <circle cx="9" cy="9" r="4" fill="var(--ink)" opacity="0.6"/>
  </svg>;
};

const MAP_IMAGES = {
  new_york:  '/images/Maps/New York City.png',
  london:    '/images/Maps/Londen.png',
  bristol:   '/images/Maps/Bristol.png',
  bethlehem: '/images/Maps/Israel.png',
  barcelona: '/images/Maps/Barcelona.png',
  // chile:  '/images/Maps/Santiago.png',
};

const MiniMap = ({ mapKey, xy }) => {
  const imgSrc = MAP_IMAGES[mapKey];
  if (imgSrc) {
    // Use the provided image — dot is already baked in
    return (
      <img src={imgSrc} alt={mapKey.replace('_', ' ')}
        style={{ width: '100%', height: '100%', objectFit: 'contain', objectPosition: 'center', display: 'block' }}
      />
    );
  }
  // Fallback SVG until the image is provided
  const map = MAP_SVGS[mapKey] || MAP_SVGS.new_york;
  const [px, py] = xy;
  return (
    <svg viewBox="0 0 100 56" preserveAspectRatio="xMidYMid meet" style={{ width: '100%', height: '100%' }}>
      {map.layers.map((layer, i) => (
        <path key={i} d={layer.d} fill={layer.fill || 'none'} stroke={layer.stroke || 'none'} strokeWidth={layer.sw || 0}/>
      ))}
      <circle cx={px} cy={py} r="3.5" fill="var(--pink)" stroke="white" strokeWidth="1"/>
    </svg>
  );
};

  'Subway art':        [1970, 1992],

const InsightMovementTimeline = ({ movement, yearMade }) => {
  const START = 1960, END = 2026;
  const pos = y => Math.max(0, Math.min(100, ((y - START) / (END - START)) * 100));
  const yearPos = pos(yearMade);
  const ticks = [1960, 1975, 1990, 2005, 2026];

  // Place movement labels above the line at their midpoint
  const labels = movement
    .filter(m => MOVEMENT_PERIODS[m])
    .map(m => ({ name: m, mid: pos((MOVEMENT_PERIODS[m][0] + Math.min(MOVEMENT_PERIODS[m][1], END)) / 2) }));

  return (
    <div style={{ padding: '14px 14px 16px', borderBottom: '1px solid var(--border)' }}>
      <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 500, fontSize: 8, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginBottom: 16 }}>Art movement timeline</div>
      <div style={{ position: 'relative', paddingTop: 28, paddingBottom: 20 }}>
        {/* Movement labels above the line */}
        {labels.map((l, i) => (
          <div key={l.name} style={{
            position: 'absolute', left: `${l.mid}%`, top: 0,
            transform: 'translateX(-50%)', textAlign: 'center',
            fontFamily: "'Inter', sans-serif", fontSize: 7.5, fontWeight: 700,
            color: 'var(--pink)', textTransform: 'uppercase', letterSpacing: '0.04em',
            lineHeight: 1.1, whiteSpace: 'nowrap',
          }}>{l.name}</div>
        ))}
        {/* Vertical tick lines from label to timeline */}
        {labels.map(l => (
          <div key={l.name + '_tick'} style={{
            position: 'absolute', left: `${l.mid}%`, top: 18, height: 10,
            width: 1, background: 'var(--pink)', opacity: 0.4, transform: 'translateX(-50%)',
          }}/>
        ))}
        {/* The single horizontal line */}
        <div style={{ position: 'relative', height: 2, background: 'var(--ink)', borderRadius: 1 }}>
          {/* Year made marker */}
          <div style={{
            position: 'absolute', left: `${yearPos}%`, top: '50%',
            transform: 'translate(-50%, -50%)',
            width: 14, height: 14, borderRadius: '50%',
            background: 'var(--pink)', border: '2px solid white',
            boxShadow: '0 0 0 1.5px var(--pink)',
          }}/>
        </div>
        {/* Year labels below */}
        <div style={{ position: 'relative', height: 20, marginTop: 6 }}>
          {ticks.map(y => (
            <div key={y} style={{
              position: 'absolute', left: `${pos(y)}%`, transform: 'translateX(-50%)',
              fontFamily: "'Inter', sans-serif", fontSize: 7, color: 'var(--ink-soft)',
            }}>{y}</div>
          ))}
          <div style={{
            position: 'absolute', left: `${yearPos}%`, top: 10, transform: 'translateX(-50%)',
            fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 8, color: 'var(--pink)',
          }}>{yearMade}</div>
        </div>
      </div>
    </div>
  );
};

const InsightMovementPyramid = ({ movement }) => {
  const [top, bl = '', br = ''] = movement;
  // Triangle corners (SVG coords): top=(50,10), BL=(8,78), BR=(92,78)
  // Centroid = (50, 55.3). Pink dot = 45% toward top corner from centroid
  // → biased toward the primary movement, clearly inside the triangle
  const dotX = 50;
  const dotY = 55.3 + 0.45 * (10 - 55.3); // ≈ 35
  return (
    <div style={{ padding: '14px 14px', borderBottom: '1px solid var(--border)' }}>
      <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 500, fontSize: 8, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginBottom: 4 }}>Movement pyramid</div>
      <div style={{ position: 'relative', height: 148 }}>
        <svg viewBox="0 0 100 88" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
          {/* Triangle edges */}
          <line x1="50" y1="10" x2="8"  y2="78" stroke="var(--ink)" strokeWidth="0.7" strokeDasharray="2.5 2"/>
          <line x1="50" y1="10" x2="92" y2="78" stroke="var(--ink)" strokeWidth="0.7" strokeDasharray="2.5 2"/>
          <line x1="8"  y1="78" x2="92" y2="78" stroke="var(--ink)" strokeWidth="0.7" strokeDasharray="2.5 2"/>
          {/* Corner dots — small, ink coloured */}
          <circle cx="50" cy="10" r="3.5" fill="var(--ink)"/>
          <circle cx="8"  cy="78" r="3.5" fill="var(--ink)"/>
          <circle cx="92" cy="78" r="3.5" fill="var(--ink)"/>
          {/* Artwork position dot — inside the triangle, biased toward primary */}
          <circle cx={dotX} cy={dotY} r="6" fill="var(--pink)" opacity="0.9"/>
          <circle cx={dotX} cy={dotY} r="2.5" fill="white"/>
        </svg>
        {/* Movement labels at corners */}
        <div style={{ position: 'absolute', left: '50%', top: 0, transform: 'translate(-50%, -2px)', textAlign: 'center' }}>
          <div style={{ fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 10, color: 'var(--ink)', whiteSpace: 'nowrap', lineHeight: 1 }}>{top}</div>
        </div>
        <div style={{ position: 'absolute', left: '8%', bottom: 0, transform: 'translateX(-50%)', textAlign: 'center' }}>
          <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 600, fontSize: 9, color: 'var(--ink)', whiteSpace: 'nowrap' }}>{bl}</div>
        </div>
        <div style={{ position: 'absolute', left: '92%', bottom: 0, transform: 'translateX(-50%)', textAlign: 'center' }}>
          <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 600, fontSize: 9, color: 'var(--ink)', whiteSpace: 'nowrap' }}>{br}</div>
        </div>
        {/* Artwork label near the dot */}
        <div style={{ position: 'absolute', left: `${dotX + 8}%`, top: `${(dotY / 88) * 100 - 3}%`, fontFamily: "'Inter', sans-serif", fontSize: 7, color: 'var(--pink)', fontWeight: 600, whiteSpace: 'nowrap' }}>this work</div>
      </div>
    </div>
  );
};

// ── ZoomCard — full editorial insight view ────────────────────────────────────
const ZoomCard = ({ art, idx, total, onClose, onPrev, onNext, onContinue, allArtworks }) => {
  const [expanded, setExpanded] = useState(false);
  const scrollRef = useRef(null);
  const visIdx = art.tileIdx !== undefined ? art.tileIdx % INSIGHTS_V.length : idx % INSIGHTS_V.length;
  const v = INSIGHTS_V[visIdx];

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    setExpanded(false);
  }, [idx]);

  // Related artworks: same artist or shared movement
  const _aw = allArtworks || ARTWORKS;
  const related = _aw
    .map((a, i) => ({ ...a, _v: INSIGHTS_V[i % INSIGHTS_V.length] }))
    .filter(a => a.title !== art.title && (a._v.artist === v.artist || a._v.movement?.some(m => v.movement?.includes(m))))
    .map(({ _v, ...a }) => a)
    .slice(0, 3);

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 20, background: '#0f0f0f', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

      {/* Header */}
      <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 14px', borderBottom: '1px solid var(--border)' }}>
        <button onClick={onClose} style={{ width: 28, height: 28, border: '1px solid rgba(255,255,255,0.3)', borderRadius: 2, background: 'rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, cursor: 'pointer', color: '#ffffff' }}>‹</button>
        <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 500, fontSize: 9, letterSpacing: '0.12em', color: 'var(--ink-soft)', textTransform: 'uppercase' }}>{idx + 1} / {total}</div>
        <Dots count={idx + 1} total={total} />
      </div>

      {/* Scrollable body */}
      <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto' }}>

        {/* 1. Artwork image */}
        <div style={{ position: 'relative', width: '100%', aspectRatio: '4/3', background: art.bg }}>
          {art.img && <img src={art.img} alt={art.title} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }}/>}
        </div>

        {/* 2. Artist info row */}
        <div style={{ padding: '12px 14px', display: 'flex', gap: 10, alignItems: 'flex-start', borderBottom: '1px solid var(--border)' }}>
          <div style={{ width: 44, height: 44, borderRadius: '50%', overflow: 'hidden', flexShrink: 0, background: 'var(--paper-2)', border: '1px solid var(--border)', position: 'relative' }}>
            {art.portrait
              ? <img src={art.portrait} alt={v.artist} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'top center' }}/>
              : <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 18, color: 'var(--ink-soft)' }}>?</div>
            }
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "'Syne', sans-serif", fontWeight: 800, fontSize: 14, color: 'var(--ink)', lineHeight: 1 }}>{v.artist}</div>
            <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 10, color: 'var(--ink-2)', marginTop: 3, fontStyle: 'italic', lineHeight: 1.4 }}>
              {v.locationLabel} · {v.artistLife.born}–{v.artistLife.died ?? 'present'} (age {v.artistAge} when made)
            </div>
            <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 10, color: 'var(--ink)', marginTop: 2, fontStyle: 'italic', fontWeight: 500 }}>
              {art.title}, {v.yearMade}
            </div>
          </div>
        </div>

        {/* 3. Description + Read more / Read less */}

        {/* 4. Two info tiles */}

        {/* 7. Process photos */}

        <InsightRelatedArt related={related} />

      </div>

      {/* Footer — prev / next only */}

const ScratchScreen = ({ artworks, onComplete, onBack }) => {
  const canvasRef = useRef(null);
  const [progress, setProgress] = useState(0);
  const [done, setDone] = useState(false);
  const drawing = useRef(false);
  const lastXY  = useRef(null);
  const doneRef = useRef(false);
  const progressRef = useRef(0);

  // Draw the initial pink stripe coating on the canvas
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // Create a tiny repeating pattern tile
    const tile = document.createElement('canvas');
    tile.width = 12; tile.height = 12;
    const tc = tile.getContext('2d');
    tc.fillStyle = '#ff3d8a';
    tc.fillRect(0, 0, 6, 12);
    tc.fillStyle = '#c2185b';
    tc.fillRect(6, 0, 6, 12);

    // Fill canvas with 45° rotated stripes
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 4);
    const pattern = ctx.createPattern(tile, 'repeat');
    ctx.fillStyle = pattern;
    const d = canvas.width * 2;
    ctx.fillRect(-d, -d, d * 2, d * 2);
    ctx.restore();
  }, []);

  const getXY = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * (canvas.width / rect.width),
      y: (src.clientY - rect.top)  * (canvas.height / rect.height),
    };
  };

  const doScratch = useCallback((pos) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 56;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (lastXY.current) {
      ctx.beginPath();
      ctx.moveTo(lastXY.current.x, lastXY.current.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
    ctx.fill();
    lastXY.current = pos;

    // Sample every ~20th pixel to measure coverage
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < data.length; i += 4 * 20) { total++; if (data[i] < 64) clear++; }
    const pct = Math.min(100, Math.round((clear / total) * 100));
    progressRef.current = pct;
    setProgress(pct);

    if (pct >= 33 && !doneRef.current) {
      doneRef.current = true;
      setDone(true);
      trackEvent('scratch_completed', 'scratch');
      completeSession();
      setTimeout(onComplete, 700);
    }
  }, [onComplete]);

  const onDown = (e) => { e.preventDefault(); drawing.current = true; lastXY.current = null; doScratch(getXY(e)); };
  const onMove = (e) => { e.preventDefault(); if (drawing.current) doScratch(getXY(e)); };
  const onUp   = () => { drawing.current = false; lastXY.current = null; };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#0a0a0a', overflow: 'hidden', position: 'relative' }}>
      {/* Artwork mosaic underneath the coating */}
      <div style={{
        position: 'absolute', inset: 0,
        display: 'grid', gridTemplateColumns: '1fr 1fr', gridTemplateRows: '1fr 1fr 1fr',
      }}>
        {[0,1,2,3,4,5].map(i => {
          const aw = i < artworks.length ? artworks[i] : null;
          return (
            <div key={i} style={{
              position: 'relative', overflow: 'hidden',
              background: aw ? aw.bg : '#222',
              borderRight:  i % 2 === 0 ? '1.5px solid rgba(26,26,26,0.6)' : 'none',
              borderBottom: i < 4       ? '1.5px solid rgba(26,26,26,0.6)' : 'none',
            }}>
              {/* Real photo if available */}
              {aw && aw.img && <img className="art-img" src={aw.img} alt={aw.title} />}
              {/* Highlight only (no cross-hatch) */}
              <div style={{
                position: 'absolute', inset: 0,
                background: 'linear-gradient(145deg, rgba(255,255,255,0.14) 0%, transparent 50%)',
                pointerEvents: 'none',
              }} />
              {/* Artist initial when no photo */}
              {aw && !aw.img && (
                <div style={{
                  position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  ...S.caveat, fontSize: 28, fontWeight: 700,
                  color: 'rgba(26,26,26,0.18)', letterSpacing: '0.01em',
                }}>
                  {aw.artist.charAt(0)}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Scratch canvas */}
      <canvas
        ref={canvasRef}
        width={390}
        height={680}
        style={{
          position: 'absolute', inset: 0, width: '100%', height: '100%',
          touchAction: 'none', cursor: 'crosshair', zIndex: 5,
        }}
        onMouseDown={onDown}
        onMouseMove={onMove}
        onMouseUp={onUp}
        onMouseLeave={onUp}
        onTouchStart={onDown}
        onTouchMove={onMove}
        onTouchEnd={onUp}
      />

      {/* "Scratch to reveal" headline — fades as you scratch */}
      <div style={{
        position: 'absolute', top: '15%', left: 0, right: 0,
        textAlign: 'center', pointerEvents: 'none', zIndex: 6,
        opacity: Math.max(0, 1 - progress / 55),
        transition: 'opacity 0.3s',
      }}>
        <div style={{ ...S.caveat, fontSize: 36, color: 'white', lineHeight: 1, textShadow: '0 1px 6px rgba(0,0,0,0.5)' }}>
          Scratch to reveal
        </div>
        <div style={{ ...S.kalam, fontSize: 13, color: 'rgba(255,255,255,0.9)', marginTop: 7, textShadow: '0 1px 3px rgba(0,0,0,0.5)' }}>
          Drag your finger across the card
        </div>
      </div>

      {/* Edition text bottom — fades too */}
      <div style={{
        position: 'absolute', bottom: '13%', left: 0, right: 0,
        textAlign: 'center', pointerEvents: 'none', zIndex: 6,
        ...S.mono, fontSize: 9, letterSpacing: '0.3em', color: 'rgba(255,255,255,0.8)',
        opacity: Math.max(0, 1 - progress / 55), transition: 'opacity 0.3s',
      }}>MOCO SCRATCH · EDITION #145</div>

      {/* Back button */}
      <button onClick={onBack} style={{
        position: 'absolute', top: 10, left: 12, zIndex: 8,
        width: 26, height: 26, borderRadius: '50%',
        border: '1.5px solid rgba(255,255,255,0.35)', background: 'rgba(0,0,0,0.4)',
        color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14,
        cursor: 'pointer',
      }}>‹</button>

      {/* Progress chip */}
      <div style={{
        position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)',
        padding: '5px 13px', background: 'rgba(0,0,0,0.6)', color: 'white',
        border: '1.5px solid rgba(255,255,255,0.25)', borderRadius: 999, zIndex: 8,
        ...S.mono, fontSize: 9, letterSpacing: '0.14em',
        display: 'flex', alignItems: 'center', gap: 9, whiteSpace: 'nowrap', pointerEvents: 'none',
      }}>
        <span>SCRATCHING</span>
        <div style={{ width: 54, height: 3, borderRadius: 999, background: 'rgba(255,255,255,0.22)', overflow: 'hidden' }}>
          <div style={{ width: `${progress}%`, height: '100%', background: 'var(--pink)', transition: 'width 0.1s', borderRadius: 999 }} />
        </div>
        <span>{progress}%</span>
      </div>

      {/* Hint at bottom */}
      <div style={{
        position: 'absolute', bottom: 16, left: 0, right: 0,
        textAlign: 'center', zIndex: 6, pointerEvents: 'none',
        ...S.caveat, fontSize: 15, color: 'white', textShadow: '0 1px 4px rgba(0,0,0,0.5)',
        opacity: progress > 55 ? 0 : 1, transition: 'opacity 0.4s',
      }}>Keep scratching — your Moco is underneath ✦</div>

      {/* Completion flash */}
      {done && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 20,
          background: 'rgba(10,10,10,0.7)', display: 'flex', alignItems: 'center',
          justifyContent: 'center', ...S.caveat, fontSize: 30, color: 'white',
          textShadow: '0 2px 8px rgba(0,0,0,0.6)',
        }}>Revealing your Moco… ✦</div>
      )}
    </div>
  );
};

    {/* Moco logo */}
    <div style={{ position:'absolute', bottom:82, right:18, textAlign:'right', zIndex:4 }}>
      <img src="/logo-moco-white.png" alt="Moco" style={{ height: 30, display: 'block', opacity: 0.9 }} />
    </div>

  </div>
);

// ─── APP ───────────────────────────────────────────────────────────────────

const FLOW = ['welcome', 'picker', 'insights', 'scratch', 'reveal', 'share'];

function App() {
  const [idx, setIdx] = useState(0);
  const [selIndices, setSelIndices] = useState([]);
  const [liveArtworks, setLiveArtworks] = useState(ARTWORKS);
  const [loading, setLoading] = useState(true);
  const trackingReady = useRef(false);
  const screen = FLOW[idx];

  useEffect(() => {
    if (!trackingReady.current) return;
    trackEvent('screen_view', screen, { screen });
  }, [screen]);

  useEffect(() => {
    let cancelled = false;

    const fetchArtworks = async () => {
      startSession();
      trackEvent('session_start', 'welcome');
      trackEvent('screen_view', 'welcome', { screen: 'welcome' });
      trackingReady.current = true;
      try {
        const sb = window.__moco_sb;
        if (!sb) throw new Error('client not ready');
        const { data, error } = await sb
          .from('artworks')
          .select('*, artists(name), artwork_media(url, type)')
          .eq('is_active', true)
          .order('grid_position');
        if (error) throw error;
        if (!data?.length) throw new Error('no data');
        const mapped = data.map(row => ({
          id: row.id,
          artist: row.artists?.name || 'Unknown',
          title: row.title,
          prompt: row.prompt || '',
          body: row.body || '',
          extra: row.extra_text || '',
          facts: row.facts || [],
          bg: row.bg_color || '#e8e4de',
          img: row.artwork_media?.find(i => i.type === 'main_image')?.url || null,
          portrait: row.portrait_url || null,
        }));
        if (!cancelled) setLiveArtworks(mapped);
      } catch (e) {
        console.warn('[Moco] Using fallback artwork data.', e.message);
      }
      if (!cancelled) setLoading(false);
    };

    const tid = setTimeout(() => { if (!cancelled) setLoading(false); }, 3000);

    if (window.__moco_sb) {
      clearTimeout(tid);
      fetchArtworks();
    } else {
      window.addEventListener('moco:sb-ready', () => { clearTimeout(tid); fetchArtworks(); }, { once: true });
    }

    return () => { cancelled = true; clearTimeout(tid); };
  }, []);

  if (loading) return (
    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'transparent' }}>
      <LoadingSpinner />
    </div>
  );

  // Build the artworks for insights / scratch / reveal from picker selection
  const artworks = selIndices.length
    ? selIndices.slice(0, 5).map(i => tileArtwork(liveArtworks, i))
    : liveArtworks.slice(0, 5);

  const go = (name) => setIdx(FLOW.indexOf(name));

  const screenEl = (() => {
    switch (screen) {
      case 'welcome':  return <WelcomeScreen onContinue={() => go('picker')} />;
      case 'picker':   return <PickerScreen artworks={liveArtworks} onContinue={indices => {
        setSelIndices(indices);
        go('insights');
        const sb = window.__moco_sb;
        if (sb) {
          const rows = indices.slice(0, 5).map((artIdx, order) => {
            const aw = tileArtwork(liveArtworks, artIdx);
            return aw.id ? { session_id: SESSION_ID, artwork_id: aw.id, pick_order: order + 1, picked_at: new Date().toISOString() } : null;
          }).filter(Boolean);
          if (rows.length) sb.from('artwork_picks').insert(rows).then(() => {});
        }
      }} onBack={() => go('welcome')} />;
      case 'insights': return <InsightGridScreen artworks={artworks} allArtworks={liveArtworks} onContinue={() => go('scratch')} onBack={() => go('picker')} />;
      case 'scratch':  return <ScratchScreen artworks={artworks} onComplete={() => go('reveal')} onBack={() => go('insights')} />;
      case 'reveal':   return <RevealScreen artworks={artworks} onShare={() => go('share')} />;
      case 'share':    return <ShareScreen artworks={artworks} onBack={() => go('welcome')} />;
    }
  })();

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}
         className="screen-slide-in">
      {screenEl}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
